[project]
name = "pilot-target"
version = "0.1.0"
description = "Disposable pilot target for the Agent R&D Platform trials: a tiny reports web app"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "playwright>=1.47",
  "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
per-file-ignores = { "tests/**" = ["S101", "S603", "S607", "S310"], "scripts/**" = ["S603", "S607"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
