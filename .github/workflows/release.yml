# Release to production (Docker on CT 206, D-11). The `production` environment carries the
# owner-approval gate (D-09): the deploy job does not start until the required reviewer approves.
# Deploy is pull-based (D-13): approval only moves the `:production` tag; CT 206 polls for it.
name: release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Integrated commit SHA to release (must be on main)"
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - name: refuse commits not on main
        run: git fetch origin main && git merge-base --is-ancestor "${{ inputs.ref }}" origin/main
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${{ github.repository }}:${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production   # required reviewer = owner (D-09)
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: promote approved image to :production (pull-based deploy, D-13)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "ghcr.io/${{ github.repository }}:production" "$IMAGE"
          echo "promoted $IMAGE -> :production; CT 206 pulls it within ~2 minutes (deploy/ct206/)"
